  <style>
    /* ui.css from bjorn/ui-foundation, vendored unedited, loads after this
       block. The page's own rules sit in the app layer between its two. */
    @layer ui-tokens, app, ui;

    @layer app {
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --surface: #fff;
      --surface-raised: #f5f5f7;
      --border: #e0e0e0;
      --text: #1d1d1f;
      --text-muted: #6e6e73;
      --accent: #0071e3;
      --accent-light: #e8f2fd;
      --selected: #f0f7ff;
      --selected-border: #0071e3;
      --tag-bg: #f0f0f0;
      --total-bg: #1d1d1f;
      --total-text: #f5f5f7;
      --savings: #287d46;
      --radius: 12px;

      --ui-text: var(--text);
      --ui-muted: var(--text-muted);
      --ui-surface: var(--surface);
      --ui-control-surface: var(--surface);
      --ui-border: var(--border);
      --ui-accent: var(--accent);
      --ui-on-accent: var(--surface);
      --ui-danger: #c62828;
      --ui-success: var(--savings);
      --ui-dialog-max-height: 80vh;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .category {
      margin-bottom: 2rem;
    }

    .category-title {
      text-align: center;
    }

    .grid {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      justify-content: center;
    }

    .grid-col {
      flex: 0 0 var(--card-width, 240px);
      max-width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .card-toggle:focus-visible,
    .tier-toggle:focus-visible,
    .tier-option:focus-visible,
    .region-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card.selected {
      border-color: var(--selected-border);
      background: var(--selected);
    }

    .card.included {
      cursor: default;
      border-color: var(--selected-border);
      background: var(--selected);
    }

    .card.included:hover {
      border-color: var(--selected-border);
    }

    .card.info-only {
      cursor: default;
    }

    .card.info-only:hover {
      border-color: var(--border);
    }

    .info-only-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      font-style: italic;
    }

    .included-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(0, 113, 227, 0.1);
      padding: 0.15rem 0.5rem;
      border-radius: 1rem;
      display: inline-block;
    }

    .bundle-note {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .bundle-savings {
      color: var(--savings);
      font-weight: 500;
    }

    .included-savings {
      display: block;
      font-size: 0.75rem;
      color: var(--savings);
      font-weight: 500;
      margin-top: 0.2rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .card-text {
      flex: 1;
      min-width: 0;
    }

    .card-icon {
      /* In em so the box grows with its initials when text is enlarged:
         32px at the 12px font-size below. */
      width: calc(32em / 12);
      height: calc(32em / 12);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }

    .card-icon img.favicon {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: contain;
      display: block;
    }

    .card-name {
      font-weight: 600;
      font-size: 1rem;
      padding-right: 1.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* The card's name is its toggle, drawn as the name. A click anywhere on
       the card still toggles it. */
    .card-toggle {
      display: block;
      max-width: 100%;
      margin: 0;
      padding-block: 0;
      padding-left: 0;
      border: 0;
      background: none;
      color: inherit;
      font-family: inherit;
      line-height: inherit;
      text-align: left;
      cursor: pointer;
    }

    .card-subtitle {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    /* Padded down to a 24px target (WCAG 2.5.8) without moving the text,
       and only down, so it stays clear of the name's toggle above it. */
    .region-link {
      cursor: pointer;
      color: var(--accent);
      padding-bottom: var(--ui-space-2);
      margin-bottom: calc(-1 * var(--ui-space-2));
    }

    .region-link:hover {
      text-decoration: underline;
    }

    .region-arrow {
      display: inline-block;
      width: 0.45rem;
      height: 0.45rem;
      border-right: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      transform: translateY(-2px) rotate(45deg);
      margin-left: 0.15rem;
      vertical-align: middle;
    }

    .card-link {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
    }

    .card-link:hover {
      text-decoration: underline;
    }

    .card-price {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .card-price strong {
      font-size: 1.1rem;
      color: var(--text);
      font-weight: 700;
    }

    .card.selected .card-price strong {
      color: var(--accent);
    }

    .tier-toggle {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--text);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
    }

    .tier-toggle:hover {
      border-color: var(--accent);
    }

    .tier-toggle .arrow {
      transition: transform 0.2s;
      width: 0.5rem;
      height: 0.5rem;
      border-right: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted);
      transform: rotate(45deg);
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .tier-toggle.open .arrow {
      transform: rotate(-135deg);
      margin-bottom: -2px;
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tier-list:not(.open) {
      display: none;
    }

    .tier-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: background 0.1s;
    }

    .tier-option:hover {
      background: var(--border);
    }

    .tier-option.active {
      background: var(--accent-light);
    }

    .tier-option.dimmed {
      opacity: 0.4;
    }

    .tier-option .tier-label {
      flex: 1;
    }

    .tier-option .tier-price {
      font-weight: 600;
      white-space: nowrap;
    }

    .info-btn {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
      transition: border-color 0.15s, color 0.15s;
    }

    .info-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    a.info-btn.link-btn {
      text-decoration: none;
      font-size: 0.85rem;
    }

    /* The .ui-dialog block draws the dialog and pads its body by 1rem; these
       size it, and the inner box makes up the page's 1.5rem. */
    .modal {
      --ui-dialog-width: 500px;
      --ui-radius-lg: var(--radius);
    }

    .modal-content {
      padding: 0.5rem;
    }

    .modal.compact {
      --ui-dialog-width: 280px;
    }

    .modal.compact .modal-content {
      padding: 0;
    }

    .modal.compact .modal-header {
      margin-bottom: 0.5rem;
    }

    .modal.compact .modal-header h2 {
      font-size: 1rem;
    }

    .modal.compact .addon-option.ui-choice {
      --ui-control-height: 1.7rem;
    }
    .modal.narrow {
      --ui-dialog-width: 380px;
    }

    .modal.sport-filter {
      --ui-dialog-width: 340px;
    }

    .modal.sport-filter .modal-header {
      margin-bottom: 0.75rem;
    }

    .sport-filter-grid {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: center;
      gap: 0 1.25rem;
    }

    .sport-filter-grid .points-modal-cat {
      padding-bottom: 1rem;
    }

    .sport-filter-grid > div > .points-modal-cat:last-child {
      padding-bottom: 0;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .modal-header .card-icon {
      width: 3em;
      height: 3em;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      flex: 1;
    }

    .modal-header-flush {
      margin-bottom: 0;
    }

    .modal-header-flush h2 {
      font-size: 1.5rem;
    }

    .modal-link {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }

    .modal-tier {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      background: var(--surface-raised);
    }

    .modal .ui-tabs {
      gap: 0.25rem;
    }

    .modal-tab-panel {
      margin-top: 0.75rem;
    }

    .addon-rows {
      display: flex;
      flex-direction: column;
    }

    .addon-row {
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }

    .addon-row:last-child {
      border-bottom: none;
    }

    .addon-row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }

    .addon-row-label {
      font-weight: 600;
      color: var(--text);
    }

    .addon-row-tier {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 0.4rem;
      padding: 0.1rem 0.45rem;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 999px;
      white-space: nowrap;
    }

    .addon-row-requires {
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .addon-row-price {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .addon-row-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      line-height: 1.4;
    }

    .modal-notice {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
      font-style: italic;
    }

    .modal-tier-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .modal-tier-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 0.4rem;
    }

    .modal-tier-sources {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
      opacity: 0.75;
    }

    .modal-tier-sources-label {
      font-weight: 600;
      margin-bottom: 0.15rem;
    }

    .modal-tier-sources-item {
      padding: 0.05rem 0;
    }

    .modal-tier-sources a {
      color: var(--accent);
      text-decoration: none;
    }

    .modal-tier-sources a:hover {
      text-decoration: underline;
    }

    .modal-tier-info ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .modal-tier-info li {
      padding: 0.1rem 0;
    }

    .modal-tier-info > ul > li::before {
      content: "✓ ";
      color: var(--accent);
      font-weight: 600;
    }

    /* A ui-disclosure is a block, so the item it sits in lays the check mark
       out beside it rather than above. */
    .modal-tier-info > ul > li:has(> .ui-disclosure) {
      display: flex;
      align-items: baseline;
      gap: var(--ui-space-1);
    }

    .modal-tier-info > ul > li:has(> .ui-disclosure) > .ui-disclosure {
      flex: 1;
      min-width: 0;
    }

    .channel-list {
      display: block;
      color: var(--text-muted);
    }

    .modal-note {
      margin-bottom: 1rem;
    }

    .modal-tier-info > ul > li.negative::before {
      content: "✗ ";
      color: #e53935;
      font-weight: 600;
    }

    .modal-tier-info > ul > li.notice::before {
      content: "ⓘ ";
      color: #f5a623;
      font-weight: 600;
    }

    .modal-tier-info ul ul {
      display: inline;
      padding: 0;
      margin: 0;
      color: var(--text-muted);
    }

    .modal-tier-info ul ul li {
      display: inline;
      padding: 0;
    }

    .modal-tier-info ul ul li::before {
      content: "";
    }

    .modal-tier-info ul ul li:not(:last-child)::after {
      content: ", ";
    }

    .modal-tier-info ul ul:before {
      content: " ";
    }

    .modal-tier-info ul ul.options {
      display: block;
      padding: 0.3rem 0 0 1.3rem;
      margin: 0;
      list-style: disc;
      color: var(--text-muted);
    }

    .modal-tier-info ul ul.options > li {
      display: list-item;
      padding: 0.05rem 0;
    }

    .modal-tier-info ul ul.options > li::before {
      content: "";
    }

    .modal-tier-info ul ul.options > li:not(:last-child)::after {
      content: "";
    }

    .modal-tier-info ul ul.options:before {
      content: "";
    }

    .modal-tier-info dl.sport-details {
      display: grid;
      grid-template-columns: max-content 1fr;
      column-gap: 0.9rem;
      row-gap: 0.65rem;
      margin: 0;
    }

    .modal-tier-info dl.sport-details dt {
      font-weight: 600;
      color: var(--text);
    }

    .modal-tier-info dl.sport-details dt::before {
      content: "✓ ";
      color: var(--accent);
      font-weight: 600;
    }

    .modal-tier-info dl.sport-details dd {
      margin: 0;
    }

    .addon-list {
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .addon-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* A radio row is a .ui-choice, held to the checkbox rows' height, size
       and colour. */
    .addon-option.ui-choice {
      --ui-control-height: 0;
    }

    .addon-option.ui-choice > span {
      font-size: 0.8rem;
    }

    .addon-option.ui-choice > span:not(.addon-price) {
      color: var(--text-muted);
    }

    .addon-option .addon-price {
      margin-left: auto;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .addon-info {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 0.4rem;
    }

    .addon-option.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .decoder-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0;
      margin-top: 0.3rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .decoder-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .decoder-btn {

      height: 26px;

      border: 1px solid var(--border);

      justify-content: center;

      height: 100%;
      background: var(--accent);

      color: var(--text-muted);
      margin-bottom: 0.4rem;

      padding: 0.4rem;

      border: none;
      border-radius: 6px;

    .points-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

      padding-top: 0.5rem;
      border-top: 1px solid var(--border);

      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-tier-addons ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .modal-tier-addons > ul > li {
      padding: 0.1rem 0;
    }

    .modal-tier-addons > ul > li::before {
      content: "+ ";
      color: var(--accent);
      font-weight: 600;
    }

    .modal-tier-addons ul ul {
      display: inline;
      padding: 0;
      margin: 0;
      color: var(--text-muted);
    }

    .modal-tier-addons ul ul li {
      display: inline;
      padding: 0;
    }

    .modal-tier-addons ul ul li::before {
      content: "";
    }

    .modal-tier-addons ul ul li:not(:last-child)::after {
      content: ", ";
    }

    .modal-tier-addons ul ul:before {
      content: " ";
    }

    .total-bar {
      position: fixed;
      bottom: 1rem;
      right: 1.5rem;
      max-width: calc(100vw - 2rem);
      background: var(--total-bg);
      color: var(--total-text);
      padding: 0.5rem 1.2rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      border-radius: 999px;
      opacity: 0;
      transform: translateY(1rem);
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }

    .total-bar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .total-monthly {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .total-period {
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .total-yearly {
      font-size: 0.8rem;
      opacity: 0.5;
      margin-left: 0.3rem;
    }

    /* Padded to a 24px target (WCAG 2.5.8) without moving the bar. */
    .total-reset {
      margin-left: 0.8rem;
      margin-block: calc(-1 * var(--ui-space-1));
      padding: var(--ui-space-1) 0;
      background: none;
      color: var(--accent);
      border: none;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .total-reset:hover {
      opacity: 0.8;
    }

    .sport-filter-wrap {
      position: fixed;
      bottom: 1rem;
      left: 1.5rem;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* The button is a ui-chip, pressed while a filter is on; the shadow lifts
       it off the cards as the old pill did. */
    .sport-filter-btn,
    .sport-filter-reset {
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .sport-filter-reset {
      padding: 0.5rem 1rem;
      background: var(--surface);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 999px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .sport-filter-reset:hover {
      opacity: 0.8;
    }

    .sport-filter-reset[hidden] {
      display: none;
    }

    /* Shown only while the chip is pressed, so it sits on the accent fill. */
    .sport-filter-count {
      background: var(--ui-on-accent);
      color: var(--ui-accent);
      font-size: 0.75rem;
      font-weight: 700;
      min-width: 1.2em;
      height: 1.2em;
      padding: 0 0.3em;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .sport-filter-count[hidden] {
      display: none;
    }

    .card.dimmed {
      opacity: 0.35;
    }

    .card-sports {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 0.5rem;
    }

    .sport-badge {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    .sport-badge.configured {
      background: rgba(0, 113, 227, 0.1);
      color: var(--accent);
    }

    .sport-badge.available {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    .footer-github {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.5rem;
      color: var(--text-muted);
    }

    .footer-github:hover { color: var(--accent); }

    .skip-link {
      position: absolute;
      left: 1rem;
      top: -3rem;
      z-index: 300;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: var(--surface);
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .skip-link:focus { top: 1rem; }

    #app:empty { min-height: 100vh; }

    @media (max-width: 500px) {
      header h1 {
        font-size: 1.4rem;
      }

      .total-bar {
        left: 1rem;
        right: 1rem;
        justify-content: center;
      }

      .sport-filter-wrap {
        left: 1rem;
        bottom: auto;
        top: 1rem;
        position: absolute;
      }
    }
    }

    /* Unlayered: the ui layer sits after app and gives .ui-list-head margin 0,
       so a head's spacing only holds outside the app layer. */
    .category-title {
      margin-bottom: 0.75rem;
    }

    .addon-section-title {
      margin-top: 1rem;
      margin-bottom: 0.2rem;
    }

    .addon-section-title:first-of-type {
      margin-top: 0.75rem;
    }

    .points-cat-title {
      margin: 1.5rem 0 0.4rem;
    }

    .points-modal-cat:first-of-type .points-cat-title,
    .sport-filter-grid .points-cat-title {
      margin-top: 0;
    }
  </style>

  </header>
  <main id="main">

      <span class="sport-filter-count" id="sport-filter-count" hidden>0</span>

  <footer>
    <div>Prisene er veiledende og kan avvike. <span id="last-updated"></span></div>
    <a class="footer-github" href="https://github.com/polybjorn/strommekalkulator" target="_blank" rel="noopener" aria-label="Vis kildekoden på GitHub">
