# The forge is origin and GitHub is a fast-forward copy with the full history,
# because GitHub Pages serves the site from it. Nothing is forced, so a commit
# made on GitHub stops the sync until it is pulled into the forge.
#
# ci-actions is cloned through $GITHUB_SERVER_URL and its scripts run directly,
# not through `uses:`. That form needs the CI host written out, this file goes
# to GitHub with the history, and the denylist gate refuses the host name.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Self-test the pattern
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/check-attribution.sh" selftest
      - name: Check the commits and the PR description
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          # Commits sync to GitHub, where a forge issue ref names another issue
          # or none. `Closes #N` goes in the PR description instead.
          NO_FORGE_REFS: "true"
        run: GITHUB_ACTION_PATH="${RUNNER_TEMP:-/tmp}/ci-actions/attribution" bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/run.sh"

  prose:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Fetch the prose engine
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/fetch-engine.sh"
      - name: Self-test the engine and the check
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/selftest.sh"
      - name: Check the commits and the PR description
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: GITHUB_ACTION_PATH="${RUNNER_TEMP:-/tmp}/ci-actions/prose" bash "${RUNNER_TEMP:-/tmp}/ci-actions/prose/run.sh"

  validate:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - run: node scripts/validate.mjs

  # ui-foundation's checks, through app_check.py rather than its app-check
  # action: this file syncs to GitHub, so it cannot name the forge-only action.
  # The tag comes from the first line of ui.css, so vendoring a new copy moves
  # the tools in the same commit.
  app-check:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Fetch ui-foundation
        run: |
          version=$(sed -n '1s/^\/\* ui\.css \([0-9.]*\):.*/\1/p' ui.css)
          git clone -q --depth 1 --branch "v$version" "$GITHUB_SERVER_URL/bjorn/ui-foundation.git" "${RUNNER_TEMP:-/tmp}/ui-foundation"
      # Lower a limit when a value goes; never raise one. The page's script is
      # app.js, which also builds markup, so it is audited with index.html. Off the scales on
      # purpose: 8px on the tier boxes, since the dialog maps --ui-radius-lg
      # to the page's 12px.
      - name: Vendored copy, host, contrast, scales and one-offs
        run: |
          python3 "${RUNNER_TEMP:-/tmp}/ui-foundation/tools/app_check.py" \
            --copy ui.css --repo "$GITHUB_SERVER_URL/bjorn/ui-foundation.git" \
            --entry index.html --scripts app.js \
            --contrast-host index.html \
            --audit-files index.html app.js --audit-max font-size=6 spacing=21 radius=3 transition=1 z-index=1 \
            --one-off-files index.html app.js --one-off-max inline-style=5 important=0 colour=8

  # Holds the page at 100 on Lighthouse on phone and desktop, plus the crawl
  # checks, through ci-actions' site-audit scripts at the release they pin.
  # The site is assembled the way pages.yml does and served under the Pages
  # path. It holds a playwright slot for a few minutes, so it runs only when a
  # served file or this workflow changed.
  site-audit:
    runs-on: playwright
    timeout-minutes: 20
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Decide whether the served site changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) from="origin/$BASE_REF" range="origin/$BASE_REF...HEAD" ;;
            push) from="$BEFORE" range="$BEFORE..HEAD" ;;
            *) from="" range="" ;;
          esac
          if [ -z "$from" ] || ! git rev-parse -q --verify "$from^{commit}" >/dev/null; then
            echo "no usable range for $EVENT_NAME, so the audit runs"
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Served files are what pages.yml copies; this workflow counts too.
          changed=$(git diff --name-only "$range" \
            | grep -E '^\.forgejo/workflows/ci\.yml$|^[^.]' \
            | grep -vE '^(scripts/|package\.json$)|\.md$' || true)
          if [ -n "$changed" ]; then
            printf 'changed:\n%s\n' "$changed"
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "no served file changed in $range"
            echo run=false >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble the site as pages.yml does
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir _site
          git ls-files -z -- ':!:.*' ':!:scripts' ':!:*.md' ':!:package.json' | xargs -0 cp --parents -t _site
      - name: Fetch site-audit
        if: steps.scope.outputs.run == 'true'
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/site-audit/fetch.sh"
      - name: Self-test the audit and the server
        if: steps.scope.outputs.run == 'true'
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/site-audit/selftest.sh"
      - name: Audit the built site
        if: steps.scope.outputs.run == 'true'
        env:
          DIR: _site
          BASE: /strommekalkulator/
          ORIGIN: https://polybjorn.github.io
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/site-audit/run.sh"

  # Gates a PR's commits against the denylist before merge, while a hit is
  # still a force-push to the PR branch rather than a rewrite of main.
  commit-gate:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Self-test commit-gate
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/selftest.sh"
      - name: Gate the PR's commits
        env:
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/commit-gate.sh"

  github-sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [attribution, prose, validate, app-check, site-audit]
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Push to GitHub
        env:
          DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          REPO: polybjorn/strommekalkulator
          REF: refs/heads/main
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/github-sync/github-sync.sh"
