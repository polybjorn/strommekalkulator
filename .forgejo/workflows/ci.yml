# The forge is origin and GitHub is a fast-forward copy with the full history,
# because GitHub Pages serves the site from it. Nothing is forced, so a commit
# made on GitHub stops the sync until it is pulled into the forge.
#
# ci-actions is cloned through $GITHUB_SERVER_URL and its scripts run directly,
# not through `uses:`. That form needs the CI host written out, this file goes
# to GitHub with the history, and the denylist gate refuses the host name.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Self-test the pattern
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/check-attribution.sh" selftest
      - name: Check the commits and the PR description
        env:
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          # Commits sync to GitHub, where a forge issue ref names another issue
          # or none. `Closes #N` goes in the PR description instead.
          NO_FORGE_REFS: "true"
        run: GITHUB_ACTION_PATH="${RUNNER_TEMP:-/tmp}/ci-actions/attribution" bash "${RUNNER_TEMP:-/tmp}/ci-actions/attribution/run.sh"

  validate:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - run: node scripts/validate.mjs

  # ui-foundation's checks, through app_check.py rather than its app-check
  # action: this file syncs to GitHub, so it cannot name the forge-only action.
  # The tag comes from the first line of ui.css, so vendoring a new copy moves
  # the tools in the same commit.
  app-check:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Fetch ui-foundation
        run: |
          version=$(sed -n '1s/^\/\* ui\.css \([0-9.]*\):.*/\1/p' ui.css)
          git clone -q --depth 1 --branch "v$version" "$GITHUB_SERVER_URL/bjorn/ui-foundation.git" "${RUNNER_TEMP:-/tmp}/ui-foundation"
      # Lower a limit when a value goes; never raise one. The page's script is
      # inline, so index.html is also the --scripts file. Off the scales on
      # purpose: 8px on the tier boxes, since the dialog maps --ui-radius-lg
      # to the page's 12px.
      - name: Vendored copy, host, contrast, scales and one-offs
        run: |
          python3 "${RUNNER_TEMP:-/tmp}/ui-foundation/tools/app_check.py" \
            --copy ui.css --repo "$GITHUB_SERVER_URL/bjorn/ui-foundation.git" \
            --entry index.html --scripts index.html \
            --contrast-host index.html \
            --audit-files index.html --audit-max font-size=6 spacing=21 radius=3 transition=1 z-index=1 \
            --one-off-files index.html --one-off-max inline-style=5 important=0 colour=8

  # Gates a PR's commits against the denylist before merge, while a hit is
  # still a force-push to the PR branch rather than a rewrite of main.
  commit-gate:
    if: github.event_name == 'pull_request'
    runs-on: docker
    timeout-minutes: 5
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Self-test commit-gate
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/selftest.sh"
      - name: Gate the PR's commits
        env:
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/commit-gate/commit-gate.sh"

  github-sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [attribution, validate, app-check]
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Fetch ci-actions
        run: git clone -q --depth 1 --branch v1 "$GITHUB_SERVER_URL/bjorn/ci-actions.git" "${RUNNER_TEMP:-/tmp}/ci-actions"
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
          DEPTH: "0"
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/checkout/checkout.sh"
      - name: Push to GitHub
        env:
          DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          DENYLIST: ${{ secrets.DEPLOY_DENYLIST }}
          REPO: polybjorn/strommekalkulator
          REF: refs/heads/main
        run: bash "${RUNNER_TEMP:-/tmp}/ci-actions/github-sync/github-sync.sh"
